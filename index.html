<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Wiki</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

<header><button id="theme-button">Light / Dark</button><a href="index.html">My Wiki</a></header>

<main>
  <h1>Welcome to My Wiki</h1>
  <p>A small encyclopedia that only contains what we wrote ourselves.</p>

  <input id="search" type="text" placeholder="Search articles...">

  <h2>All articles</h2>

  <!--
    HOW TO ADD YOUR ARTICLE HERE:
    1. Copy the line below that starts with <li>
    2. Paste it on its OWN new line, keeping alphabetical order
    3. Change the link and the name
    Do NOT edit other people's lines. This keeps commits from clashing.
  -->
  <ul id="article-list">
    <li><a href="pages/hoa-hoc.html">Hóa học (Chemistry)</a></li>
  </ul>
</main>

<script>
  // Very small search: hide list items that don't match what you typed.
  var box = document.getElementById("search");
  var items = document.querySelectorAll("#article-list li");

  box.addEventListener("input", function () {
    var text = box.value.toLowerCase();
    for (var i = 0; i < items.length; i++) {
      var name = items[i].textContent.toLowerCase();
      items[i].style.display = name.includes(text) ? "" : "none";
    }
  });
</script>

</body>
</html>
